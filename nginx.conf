server {
    listen 80;
    server_name noscadeaux.fr www.noscadeaux.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name noscadeaux.fr www.noscadeaux.fr;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/noscadeaux.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noscadeaux.fr/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── nosblindtests.fr ────────────────────────────────────────────────
server {
    listen 80;
    server_name nosblindtests.fr www.nosblindtests.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name nosblindtests.fr www.nosblindtests.fr;
    ssl_certificate     /etc/letsencrypt/live/nosblindtests.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nosblindtests.fr/privkey.pem;

    location / {
        proxy_pass http://blindtest-prod-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws {
        proxy_pass         http://blindtest-prod-frontend:80/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

