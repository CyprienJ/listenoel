services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=noscadeaux
      - POSTGRES_USER=user_cadeaux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_cadeaux -d noscadeaux"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/cyprienj/noscadeaux:latest
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DATABASE_URL=postgres://user_cadeaux:${POSTGRES_PASSWORD}@db:5432/noscadeaux
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEV=False
      - ANYMAIL_RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: