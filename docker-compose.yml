services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=noscadeaux
      - POSTGRES_USER=user_cadeaux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_cadeaux -d noscadeaux"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/cyprienj/noscadeaux:latest
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://user_cadeaux:${POSTGRES_PASSWORD}@db:5432/noscadeaux
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEV=False
      - ANYMAIL_RESEND_API_KEY=${RESEND_API_KEY}
      - BUG_REPORT_REPOSITORY=${BUG_REPORT_REPOSITORY:-}
      - BUG_REPORT_TOKEN=${BUG_REPORT_TOKEN:-}
      - BUG_REPORT_LABELS=${BUG_REPORT_LABELS:-bug,source:user-report,status:unconfirmed}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - noscadeaux-django

  scheduler:
      image: ghcr.io/cyprienj/noscadeaux:latest
      command: >
        sh -c "sleep 30;
               while true; do
                 python manage.py send_notification_digests;
                 python manage.py send_event_reminders;
                 sleep 3600;
               done"
      environment:
        - DATABASE_URL=postgres://user_cadeaux:${POSTGRES_PASSWORD}@db:5432/noscadeaux
        - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
        - DEV=False
        - ANYMAIL_RESEND_API_KEY=${RESEND_API_KEY}
        - PUBLIC_BASE_URL=https://noscadeaux.fr
      depends_on:
        db:
          condition: service_healthy
      restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - default
      - proxy

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  proxy:
    external: true

volumes:
  postgres_data:
  static_volume:
     name: noscadeaux_static
  media_volume:
    name: noscadeaux_media
  certbot_etc:
  certbot_var:
  webroot:
