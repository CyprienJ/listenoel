{% load i18n %}
<div class="modal fade" id="editPriceModal{{ item.gift.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 rounded-5 shadow-lg auth-card">
            <div class="modal-header border-0 p-4 pb-0">
                <h5 class="modal-title fw-bold">{% trans "Edit price" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="post" action="{% url 'edit_gift_price' item.gift.id %}">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="priceInput" class="form-label fw-medium">{% trans "Estimated price (€)" %}</label>
                        <input type="number" step="0.01" name="price"
                               class="form-control rounded-4 auth-input"
                               value="{{ item.gift.price|default:'' }}"
                               placeholder="ex: 45.00"
                               id="priceInput">
                    </div>
                    <p class="small text-muted">
                        <i class="bi bi-info-circle"></i>
                        {% trans "This helps others to organize collective gifts." %}
                    </p>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4"
                            data-bs-dismiss="modal">{% trans "Cancel" %}</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">{% trans "Save" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
