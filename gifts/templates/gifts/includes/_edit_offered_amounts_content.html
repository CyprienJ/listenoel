{% load i18n %}
<div class="modal-header border-0 p-4 pb-0">
    <h5 class="modal-title fw-bold"><i class="bi bi-pencil me-2"></i>{{ gift.title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body p-4">
    <p class="text-muted small">{% trans "Record the amounts each person contributed." %}</p>
    <div class="d-grid gap-2 mt-3">
        {% for reservation in reservations %}
            <div class="input-group rounded-pill overflow-hidden border">
                <span class="input-group-text flex-grow-1 bg-transparent border-0 px-4 fw-bold">
                    {{ reservation.reserver.nickname }}
                </span>
                <input type="number" step="0.01" min="0"
                       class="form-control border-0 text-end edit-split-amount"
                       data-reserver-id="{{ reservation.reserver.id }}"
                       value="{{ reservation.amount_paid|default:'' }}"
                       placeholder="0.00"
                       style="max-width: 100px;">
                <span class="input-group-text bg-transparent border-0 pe-3">€</span>
            </div>
        {% endfor %}
    </div>
    <div class="mt-3 p-3 bg-body-secondary rounded-4">
        <div class="d-flex justify-content-between align-items-center">
            <span class="text-muted small">{% trans "Total" %}</span>
            <span class="fw-bold" id="editSplitTotal">0.00 €</span>
        </div>
    </div>
</div>
<div class="modal-footer border-0 p-4 pt-0 flex-column gap-2">
    <button type="button" class="btn btn-primary rounded-pill px-4 w-100"
            onclick="saveOfferAmounts('{% url 'edit_offered_amounts' gift.id %}')">
        <i class="bi bi-check2 me-1"></i>{% trans "Save" %}
    </button>
    <button type="button" class="btn btn-link text-muted w-100" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
</div>
