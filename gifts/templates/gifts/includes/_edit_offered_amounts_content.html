{% load i18n %}
<div class="modal-header border-0 p-4 pb-0">
    <h5 class="modal-title fw-bold"><i class="bi bi-pencil me-2"></i>{{ gift.title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body p-4">
    {% include "gifts/includes/_cost_split_fields.html" with field_prefix="edit" cost_value=actual_cost checkbox_class="edit-split-checkbox" %}
</div>
<div class="modal-footer border-0 p-4 pt-0 flex-column gap-2">
    <button type="button" class="btn btn-primary rounded-pill px-4 w-100"
            onclick="saveOfferAmounts('{% url 'edit_offered_amounts' gift.id %}')">
        <i class="bi bi-check2 me-1"></i>{% trans "Save" %}
    </button>
    <button type="button" class="btn btn-link text-muted w-100" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
</div>
