{% load i18n %}
<div class="modal fade" id="reserveModal{{ item.gift.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-5 shadow-lg auth-card" id="modalContent{{ item.gift.id }}">
            {% include 'gifts/includes/_reserve_modal_content.html' %}
        </div>
    </div>
</div>

<script>
    async function updateModal(response, giftId) {
        if (response.ok) {
            const newHtml = await response.text();
            const container = document.getElementById(`modalContent${giftId}`);
            if (container) {
                container.innerHTML = newHtml;
            }
        } else {
            alert("Error updating modal");
            console.log(response);
        }
    }

    async function reserveGift(url, isExclusive, giftId, userId, groupId) {
        console.log(groupId)
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                exclusivity: isExclusive,
                user_id: userId,
                group_id: groupId,
            })
        });

        await updateModal(response, giftId);
    }

    async function modifyReservation(url, reservation_user_id_to_modify, giftId, groupId) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                reservation_user_id_to_modify: reservation_user_id_to_modify,
                group_id: groupId
            })
        });
        await updateModal(response, giftId);
    }

    async function deleteReservation(url, reservation_user_id_to_delete, giftId, groupId) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                reservation_user_id_to_delete: reservation_user_id_to_delete,
                group_id: groupId
            })
        });

        await updateModal(response, giftId);
    }

    async function offerGift(url, giftId, groupId) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({group_id: groupId})
        });
        if (response.ok) {
            document.getElementById('offerModalContent').innerHTML = await response.text();
            if (typeof setupSplitTotal === 'function') setupSplitTotal();
            const reserveModal = bootstrap.Modal.getInstance(document.getElementById(`reserveModal${giftId}`));
            if (reserveModal) reserveModal.hide();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('offerModal')).show();
        }
    }

</script>
