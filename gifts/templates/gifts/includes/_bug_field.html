{% load i18n %}
<label for="{{ field.id_for_label }}" class="form-label fw-semibold">
    {{ field.label }}
    {% if not field.field.required %}<span class="text-muted fw-normal">{% trans "(optional)" %}</span>{% endif %}
</label>
{{ field }}
{% if field.help_text %}<div class="nc-bug-help mt-1">{{ field.help_text }}</div>{% endif %}
{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
