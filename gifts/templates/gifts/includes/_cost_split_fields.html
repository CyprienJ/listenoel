{% load i18n %}
<!-- Coût total -->
<div class="mb-4">
    <label class="form-label small fw-bold text-muted" for="{{ field_prefix }}TotalCost">
        <i class="bi bi-cash-coin me-1"></i>{% trans "Total cost" %}
    </label>
    <div class="input-group rounded-pill overflow-hidden border">
        <input type="number" step="0.01" min="0"
               class="form-control border-0 px-4"
               id="{{ field_prefix }}TotalCost"
               placeholder="0.00"
               value="{{ cost_value|default:'' }}">
        <span class="input-group-text bg-transparent border-0 pe-3">€</span>
    </div>
</div>

{% if givers %}
<!-- Qui a payé -->
<div class="mb-4">
    <label class="form-label small fw-bold text-muted" for="{{ field_prefix }}PayerSelect">
        <i class="bi bi-person-check me-1"></i>{% trans "Who paid?" %}
    </label>
    <select id="{{ field_prefix }}PayerSelect" class="form-select rounded-4 border">
        <option value="">— {% trans "Select" %} —</option>
        {% for member in givers %}
        <option value="{{ member.id }}" {% if member.id == pre_payer_id %}selected{% endif %}>
            {{ member.nickname|capfirst }}
        </option>
        {% endfor %}
    </select>
</div>

<!-- Réparti entre -->
<div class="mb-3">
    <div class="small fw-bold text-muted mb-2">
        <i class="bi bi-people me-1"></i>{% trans "Split between" %}
    </div>
    <div class="d-grid gap-1">
        {% for member in givers %}
        <div class="form-check ps-4 py-1">
            <input type="checkbox" class="form-check-input {{ checkbox_class }}"
                   id="{{ field_prefix }}Split_{{ member.id }}"
                   value="{{ member.id }}"
                   {% if member.id in pre_split_ids %}checked{% endif %}>
            <label class="form-check-label small" for="{{ field_prefix }}Split_{{ member.id }}">
                {{ member.nickname|capfirst }}
            </label>
        </div>
        {% endfor %}
    </div>
    <div class="mt-2 p-2 bg-body-secondary rounded-3 d-flex justify-content-between small">
        <span class="text-muted">{% trans "Per person" %}</span>
        <span class="fw-bold" id="{{ field_prefix }}SharePerPerson">—</span>
    </div>
</div>
{% endif %}
