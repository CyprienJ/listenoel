{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container py-5 text-center">
    <div class="mb-4">
        <i class="bi bi-person-x fs-1 text-muted"></i>
    </div>
    <h1 class="display-5 fw-bold">{% trans "User not found" %}</h1>
    <p class="lead text-muted">
        {% trans "This user doesn't exist or you don't have permission to view their list." %}
    </p>
    <div class="mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-4">
            {% trans "Back to Dashboard" %}
        </a>
    </div>
</div>
{% endblock %}
