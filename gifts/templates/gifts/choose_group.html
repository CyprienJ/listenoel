{% extends "gifts/base.html" %}
{% load i18n %}
{% block title %}{% trans "Choose your group" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">

    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3 text-center">{% trans "Choose your group" %}</h1>

        <ul class="list-group">
          {% for g in groups %}
            <li class="list-group-item">
              <a href="{% url 'choose_user_in_group' g.id %}">{{ g.name }}</a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

  </div>
</div>
{% endblock %}
