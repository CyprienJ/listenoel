<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Wishlist{% endblock %}</title>

  <link rel="icon" href="{% static 'gifts/favicon.ico' %}" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    // Applique le thème avant le rendu (évite le "flash" clair/sombre)
    (function () {
      const stored = localStorage.getItem("theme") || "auto"; // "light" | "dark" | "auto"
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const resolved = stored === "auto" ? (prefersDark ? "dark" : "light") : stored;
      document.documentElement.setAttribute("data-bs-theme", resolved);
    })();
  </script>

    <style>
    html, body {
      min-height: 100%;
    }

    [data-bs-theme="light"] body {
      background: linear-gradient(180deg, #f3f6ff 0%, #f7f9fc 35%, #ffffff 100%);
    }

    [data-bs-theme="dark"] body {
      background: linear-gradient(180deg, #0b1220 0%, #0f172a 45%, #111827 100%);
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{% url 'dashboard' %}">🎁 Wishlist</a>

    <div class="d-flex align-items-center gap-3">
      {% if current %}
        <span class="text-white me-2">
          Connecté : {{ current.pseudo }}
        </span>

        <!-- Nouveau dropdown pour les préférences -->
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="preferencesDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Préférences
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="preferencesDropdown">
            <!-- Sélecteur de thème intégré -->
            <li class="px-3 py-2">
              <div class="d-flex align-items-center gap-2">
                <label for="themeSelect" class="small text-body-secondary mb-0">Thème</label>
                <select id="themeSelect" class="form-select form-select-sm" style="width: 170px;">
                  <option value="auto">🖥️ Par défaut (OS)</option>
                  <option value="light">☀️ Clair</option>
                  <option value="dark">🌙 Sombre</option>
                </select>
              </div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <!-- Lien Changer de mot de passe -->
            <li><a class="dropdown-item" href="{% url 'change_password_form' %}">Changer de mot de passe</a></li>
            <!-- Lien Se déconnecter -->
            <li><a class="dropdown-item" href="{% url 'logout' %}">Se déconnecter</a></li>
          </ul>
        </div>
      {% endif %}
    </div>
  </div>
</nav>


<div class="container">
  {% block content %}{% endblock %}
</div>

<script>
  (function () {
    const select = document.getElementById("themeSelect");
    if (!select) return;

    function applyTheme(choice) {
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const resolved = choice === "auto" ? (prefersDark ? "dark" : "light") : choice;
      document.documentElement.setAttribute("data-bs-theme", resolved);
    }

    // Init select depuis localStorage
    const stored = localStorage.getItem("theme") || "auto";
    select.value = stored;
    applyTheme(stored);

    // Changement utilisateur
    select.addEventListener("change", function () {
      const choice = select.value; // "light" | "dark" | "auto"
      localStorage.setItem("theme", choice);
      applyTheme(choice);
    });

    // Si "auto", et que l’OS change (clair<->sombre), on suit automatiquement
    const media = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (media && media.addEventListener) {
      media.addEventListener("change", function () {
        const currentChoice = localStorage.getItem("theme") || "auto";
        if (currentChoice === "auto") applyTheme("auto");
      });
    }
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
