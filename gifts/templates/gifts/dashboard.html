{% extends "gifts/base.html" %}
{% block title %}Accueil{% endblock %}

{% block content %}
<h2 class="mb-4 text-center">Bonjour {{ current.pseudo }} {{ greeting_emoji }}</h2>

<style>
  .dashboard-card {
    width: 100%;
  }

  @media (min-width: 992px) {
    .dashboard-card {
      width: 50%;
    }
  }
</style>

<div class="d-grid gap-4">

  <div class="card shadow-sm dashboard-card mx-auto">
    <div class="card-body text-center">
      <a href="{% url 'view_list' current.id %}" class="btn btn-success btn-lg w-100">
        Voir ma liste
      </a>
    </div>
  </div>

  <div class="card shadow-sm dashboard-card mx-auto">
    <div class="card-body">
      <h5 class="card-title">Voir une liste</h5>
      <ul class="list-group list-group-flush">
        {% for u in users %}
          <li class="list-group-item">
            <a href="{% url 'view_list' u.id %}" class="text-decoration-none">
              {{ u.pseudo }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>

</div>
{% endblock %}
