{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container py-5 text-center">
    <div class="mb-4">
        <i class="bi bi-search fs-1 text-muted"></i>
    </div>
    <h1 class="display-5 fw-bold">{% trans "Group not found" %}</h1>
    <p class="lead text-muted">
        {% trans "This group doesn't exist or has been deleted." %}
    </p>
    <div class="mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-arrow-left me-2"></i>{% trans "Back to Dashboard" %}
        </a>
    </div>
</div>
{% endblock %}
