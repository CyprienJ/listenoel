{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- On utilise bg-body pour forcer la couleur de fond du thème (clair ou sombre) -->
        <div class="col-md-8 p-4 p-md-5 rounded shadow-sm border border-secondary-subtle bg-body text-body">
            <div class="changelog-content">
                {{ changelog_html|safe }}
            </div>
            <hr class="mt-5 opacity-25">
            <div class="d-flex justify-content-between align-items-center">
                <a href="{% url 'welcome' %}" class="btn btn-outline-secondary btn-sm">
                    {% trans "Back" %}
                </a>
                <small class="text-muted">Nos Cadeaux Changelog</small>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-body {
        background-color: var(--bs-body-bg) !important;
    }

    .changelog-content {
        color: var(--bs-body-color);
    }

    .changelog-content h1 {
        color: #d9534f;
        border-bottom: 2px solid rgba(128, 128, 128, 0.2);
        padding-bottom: 10px;
        font-weight: bold;
    }

    .changelog-content h2 {
        margin-top: 1.5rem;
        color: var(--bs-heading-color, #d9534f);
        font-size: 1.5rem;
    }

    .changelog-content h3 {
        margin-top: 1.2rem;
        font-size: 1.1rem;
        color: var(--bs-secondary-color);
    }

    .changelog-content ul {
        padding-left: 1.5rem;
    }

    .changelog-content code {
        background: rgba(128, 128, 128, 0.1);
        color: #d9534f;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
    }
</style>
{% endblock %}
