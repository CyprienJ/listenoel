{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg rounded-5 p-4 login-card" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="brand-icon-container d-inline-block p-3 rounded-circle mb-3">
                    <i class="bi bi-key fs-2 text-primary"></i>
                </div>
                <h2 class="fw-bold card-title">{% trans "Password forgotten" %}</h2>
                <p class="card-subtitle text-muted">{% trans "Enter your email to reset it" %}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-medium card-label">{% trans "Email" %}</label>
                    <input type="email" name="email" class="form-control form-control-lg rounded-pill border-1 p-3" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">
                    {% trans "Send link" %}
                </button>
            </form>
            <div class="text-center">
                <a href="{% url 'login' %}" class="small text-muted text-decoration-none">{% trans "Back to login" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
