{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg rounded-5 p-4 login-card text-center" style="max-width: 450px; width: 100%;">
        <div class="card-body">
            <div class="bg-success-container d-inline-block p-4 rounded-circle mb-4">
                <i class="bi bi-check-all fs-1 text-success"></i>
            </div>
            <h2 class="fw-bold mb-3">{% trans "Password changed" %} !</h2>
            <p class="text-muted mb-4">
                {% trans "Your password has been set. You may go ahead and log in now." %}
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">
                {% trans "Log in" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
